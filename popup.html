<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Твой плейлист</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card" id="card">
    <div class="now">
      <div class="cover" id="cover">
        <img id="thumb" alt="" hidden>
        <svg class="cover-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3V13.55C11.41 13.21 10.73 13 10 13C7.79 13 6 14.79 6 17S7.79 21 10 21 14 19.21 14 17V7H18V3H12Z"/></svg>
      </div>
      <div class="meta">
        <div class="title" id="title">Проверяю плеер…</div>
        <div class="sub" id="sub"></div>
      </div>
    </div>

    <div class="controls" id="controls">
      <button class="btn" id="prevBtn" title="Предыдущий" aria-label="Предыдущий">
        <svg viewBox="0 0 24 24"><path d="M6 6H8V18H6V6M9.5 12L18 6V18L9.5 12Z"/></svg>
      </button>
      <button class="btn btn-play" id="playBtn" title="Играть / пауза" aria-label="Играть или пауза">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5V19L19 12L8 5Z"/></svg>
      </button>
      <button class="btn" id="nextBtn" title="Следующий" aria-label="Следующий">
        <svg viewBox="0 0 24 24"><path d="M16 18H18V6H16V18M6 18L14.5 12L6 6V18Z"/></svg>
      </button>
    </div>

    <div class="volume" id="volume">
      <button class="vol-btn" id="muteBtn" title="Без звука" aria-label="Без звука">
        <svg id="volIcon" viewBox="0 0 24 24"></svg>
      </button>
      <input class="vol" id="volSlider" type="range" min="0" max="100" step="1" value="100" aria-label="Громкость">
    </div>

    <button class="open" id="openBtn">Открыть плеер</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
